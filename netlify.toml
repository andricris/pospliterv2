[build]
  publish = "."

# ===== Domain redirects =====
# Domain utama sekarang adalah https://andriland.com/.
# Semua akses ke subdomain Netlify dan domain lama diarahkan ke domain utama.
[[redirects]]
  from = "https://andri-land.netlify.app"
  to = "https://andriland.com"
  status = 301
  force = true

[[redirects]]
  from = "https://andri-land.netlify.app/*"
  to = "https://andriland.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://andri-land.netlify.app"
  to = "https://andriland.com"
  status = 301
  force = true

[[redirects]]
  from = "http://andri-land.netlify.app/*"
  to = "https://andriland.com/:splat"
  status = 301
  force = true

